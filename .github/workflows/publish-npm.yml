name: publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to publish
        required: true
        default: v0.1.1

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Require exact signed tag and package version
        shell: bash
        run: |
          test "$(git describe --tags --exact-match)" = "${{ inputs.tag }}"
          test "v$(node -p "require('./package.json').version")" = "${{ inputs.tag }}"

      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm publish
